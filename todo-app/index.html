<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة مهام الفريق</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-top: 50px;
        }

        .login-card h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .login-card p {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            transition: border-color 0.3s;
            background: white;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .error-msg {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .success-msg {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.2);
            padding: 10px 15px;
            border-radius: 12px;
            margin-top: 15px;
        }

        .user-info span {
            font-size: 0.9rem;
        }

        .logout-btn {
            background: rgba(255,255,255,0.3);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,0.4);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .app-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .sync-status {
            text-align: center;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .sync-status.online {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .sync-status.offline {
            background: #fff3e0;
            color: #e65100;
        }

        .sync-status.syncing {
            background: #e3f2fd;
            color: #1565c0;
        }

        .refresh-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            margin-right: 5px;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .input-section input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            transition: border-color 0.3s;
        }

        .input-section input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-section button {
            padding: 15px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-section button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .tasks-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .task-item:hover {
            background: #f0f0f0;
        }

        .task-item.completed {
            background: #e8f5e9;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #888;
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #667eea;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .task-checkbox:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .task-item.completed .task-checkbox {
            background: #4caf50;
            border-color: #4caf50;
        }

        .task-checkbox::after {
            content: '✓';
            color: white;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .task-item.completed .task-checkbox::after {
            opacity: 1;
        }

        .task-content {
            flex: 1;
        }

        .task-text {
            font-size: 1rem;
            color: #333;
        }

        .task-owner {
            font-size: 0.75rem;
            color: #888;
            margin-top: 3px;
        }

        .task-time {
            font-size: 0.7rem;
            color: #aaa;
        }

        .delete-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: #ffebee;
            color: #e53935;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            background: #e53935;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .email-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .email-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .email-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
        }

        .email-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .admin-tab {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .admin-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .admin-tab:hover:not(.active) {
            background: #e0e0e0;
        }

        .admin-badge {
            background: #ff9800;
            color: white;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            margin-right: 10px;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 1.5rem;
            }
            
            .app-card, .login-card {
                padding: 20px;
            }
            
            .input-section {
                flex-direction: column;
            }
            
            .input-section button {
                padding: 15px;
            }

            .user-info {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            .admin-tabs {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Page -->
        <div id="login-page">
            <div class="login-card">
                <h1>📋 قائمة مهام الفريق</h1>
                <p>سجّل دخولك للوصول لمهامك</p>
                
                <div class="error-msg" id="error-msg"></div>
                
                <div class="form-group">
                    <label>اختر المستخدم</label>
                    <select id="username">
                        <option value="">-- اختر --</option>
                        <option value="admin">د.فلاح سليم فالح (المدير)</option>
                        <option value="ahmed">أحمد عبد الشكور</option>
                        <option value="sadiq">صادق نبيل صادق</option>
                        <option value="haider">حيدر شامل</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور">
                </div>
                
                <button class="login-btn" onclick="login()">دخول</button>
            </div>
        </div>

        <!-- App Page -->
        <div id="app-page" class="hidden">
            <header class="header">
                <h1>📋 قائمة مهام الفريق</h1>
                <p id="welcome-msg">مرحباً!</p>
                
                <div class="user-info">
                    <span id="user-display"></span>
                    <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
                </div>

                <div class="stats">
                    <span class="stat" id="total-stat">المجموع: 0</span>
                    <span class="stat" id="completed-stat">مكتمل: 0</span>
                    <span class="stat" id="pending-stat">متبقي: 0</span>
                </div>
            </header>

            <div class="app-card">
                <div class="sync-status online" id="sync-status">
                    <button class="refresh-btn" onclick="loadTasks()">🔄</button>
                    <span id="sync-text">متصل - البيانات محدثة</span>
                </div>

                <!-- Admin Tabs -->
                <div class="admin-tabs hidden" id="admin-tabs">
                    <button class="admin-tab active" data-user="all">الكل</button>
                </div>

                <div class="input-section" id="input-section">
                    <input type="text" id="task-input" placeholder="أضف مهمة جديدة...">
                    <button onclick="addTask()">+</button>
                </div>

                <ul class="tasks-list" id="tasks-list">
                    <li class="loading">جاري التحميل...</li>
                </ul>

                <div class="email-section">
                    <button class="email-btn" onclick="sendEmailReport()" id="email-btn" disabled>
                        <span>📧</span>
                        <span>إرسال تقرير بالإيميل</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase Configuration - مشروع تجريبي
        const firebaseConfig = {
            apiKey: "AIzaSyBnQPazC6jmFLl5dnjMNkKfyw2Bz0rJFJI",
            authDomain: "team-todo-demo-app.firebaseapp.com",
            projectId: "team-todo-demo-app",
            storageBucket: "team-todo-demo-app.firebasestorage.app",
            messagingSenderId: "574621231873",
            appId: "1:574621231873:web:5a7e75c0f69f5c1d8b3e2a"
        };

        // المستخدمون
        const USERS = {
            'admin': { password: 'admin123', name: 'د.فلاح سليم فالح', isAdmin: true },
            'ahmed': { password: '1234', name: 'أحمد عبد الشكور', isAdmin: false },
            'sadiq': { password: '1234', name: 'صادق نبيل صادق', isAdmin: false },
            'haider': { password: '1234', name: 'حيدر شامل', isAdmin: false }
        };

        let currentUser = null;
        let allTasks = [];
        let selectedUserFilter = 'all';
        let db = null;
        let unsubscribe = null;

        // تهيئة Firebase
        function initFirebase() {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                console.log('Firebase initialized');
                return true;
            } catch (e) {
                console.error('Firebase init error:', e);
                return false;
            }
        }

        function init() {
            const firebaseReady = initFirebase();
            
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser && USERS[savedUser]) {
                currentUser = savedUser;
                showApp();
            }

            document.getElementById('password').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') login();
            });
        }

        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            if (!username) {
                errorMsg.textContent = 'الرجاء اختيار المستخدم';
                errorMsg.style.display = 'block';
                return;
            }

            if (!password) {
                errorMsg.textContent = 'الرجاء إدخال كلمة المرور';
                errorMsg.style.display = 'block';
                return;
            }

            if (USERS[username].password !== password) {
                errorMsg.textContent = 'كلمة المرور غير صحيحة';
                errorMsg.style.display = 'block';
                return;
            }

            currentUser = username;
            localStorage.setItem('currentUser', username);
            errorMsg.style.display = 'none';
            showApp();
        }

        function logout() {
            if (unsubscribe) {
                unsubscribe();
                unsubscribe = null;
            }
            currentUser = null;
            localStorage.removeItem('currentUser');
            document.getElementById('login-page').classList.remove('hidden');
            document.getElementById('app-page').classList.add('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function showApp() {
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('app-page').classList.remove('hidden');

            const user = USERS[currentUser];
            document.getElementById('welcome-msg').textContent = `مرحباً ${user.name}!`;
            
            let userDisplay = user.name;
            if (user.isAdmin) {
                userDisplay = `<span class="admin-badge">مدير</span>${user.name}`;
            }
            document.getElementById('user-display').innerHTML = userDisplay;

            const adminTabs = document.getElementById('admin-tabs');
            if (user.isAdmin) {
                adminTabs.classList.remove('hidden');
                setupAdminTabs();
                document.getElementById('input-section').classList.add('hidden');
            } else {
                adminTabs.classList.add('hidden');
                document.getElementById('input-section').classList.remove('hidden');
            }

            setupRealtimeListener();

            document.getElementById('task-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') addTask();
            });
        }

        function setupAdminTabs() {
            const adminTabs = document.getElementById('admin-tabs');
            adminTabs.innerHTML = '<button class="admin-tab active" data-user="all">الكل</button>';
            
            Object.keys(USERS).forEach(username => {
                if (!USERS[username].isAdmin) {
                    const btn = document.createElement('button');
                    btn.className = 'admin-tab';
                    btn.dataset.user = username;
                    btn.textContent = USERS[username].name;
                    adminTabs.appendChild(btn);
                }
            });

            adminTabs.querySelectorAll('.admin-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    adminTabs.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    selectedUserFilter = this.dataset.user;
                    renderTasks();
                });
            });
        }

        function updateSyncStatus(status, text) {
            const statusEl = document.getElementById('sync-status');
            const textEl = document.getElementById('sync-text');
            statusEl.className = 'sync-status ' + status;
            textEl.textContent = text;
        }

        function setupRealtimeListener() {
            if (!db) {
                loadTasksFromLocalStorage();
                return;
            }

            updateSyncStatus('syncing', 'جاري المزامنة...');

            if (unsubscribe) {
                unsubscribe();
            }

            unsubscribe = db.collection('tasks')
                .orderBy('createdAt', 'desc')
                .onSnapshot(
                    (snapshot) => {
                        allTasks = [];
                        snapshot.forEach(doc => {
                            allTasks.push({ id: doc.id, ...doc.data() });
                        });
                        renderTasks();
                        updateSyncStatus('online', 'متصل - البيانات محدثة');
                    },
                    (error) => {
                        console.error('Firestore error:', error);
                        updateSyncStatus('offline', 'غير متصل - استخدام البيانات المحلية');
                        loadTasksFromLocalStorage();
                    }
                );
        }

        function loadTasks() {
            if (db) {
                setupRealtimeListener();
            } else {
                loadTasksFromLocalStorage();
            }
        }

        function loadTasksFromLocalStorage() {
            const saved = localStorage.getItem('team-tasks-v2');
            if (saved) {
                allTasks = JSON.parse(saved);
            }
            renderTasks();
        }

        function saveToLocalStorage() {
            localStorage.setItem('team-tasks-v2', JSON.stringify(allTasks));
        }

        async function addTask() {
            const input = document.getElementById('task-input');
            const text = input.value.trim();

            if (!text) return;

            const task = {
                text: text,
                completed: false,
                owner: currentUser,
                ownerName: USERS[currentUser].name,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                createdAtLocal: new Date().toISOString()
            };

            input.value = '';
            input.focus();

            if (db) {
                try {
                    await db.collection('tasks').add(task);
                } catch (e) {
                    console.error('Error adding task:', e);
                    task.id = Date.now().toString();
                    task.createdAt = new Date();
                    allTasks.unshift(task);
                    saveToLocalStorage();
                    renderTasks();
                }
            } else {
                task.id = Date.now().toString();
                task.createdAt = new Date();
                allTasks.unshift(task);
                saveToLocalStorage();
                renderTasks();
            }
        }

        async function toggleTask(id) {
            const task = allTasks.find(t => t.id === id);
            if (!task) return;

            const newStatus = !task.completed;

            if (db) {
                try {
                    await db.collection('tasks').doc(id).update({ completed: newStatus });
                } catch (e) {
                    console.error('Error toggling task:', e);
                    task.completed = newStatus;
                    saveToLocalStorage();
                    renderTasks();
                }
            } else {
                task.completed = newStatus;
                saveToLocalStorage();
                renderTasks();
            }
        }

        async function deleteTask(id) {
            if (db) {
                try {
                    await db.collection('tasks').doc(id).delete();
                } catch (e) {
                    console.error('Error deleting task:', e);
                    allTasks = allTasks.filter(t => t.id !== id);
                    saveToLocalStorage();
                    renderTasks();
                }
            } else {
                allTasks = allTasks.filter(t => t.id !== id);
                saveToLocalStorage();
                renderTasks();
            }
        }

        function renderTasks() {
            const list = document.getElementById('tasks-list');
            const user = USERS[currentUser];
            let tasksToShow = [];

            if (user.isAdmin) {
                if (selectedUserFilter === 'all') {
                    tasksToShow = [...allTasks];
                } else {
                    tasksToShow = allTasks.filter(t => t.owner === selectedUserFilter);
                }
            } else {
                tasksToShow = allTasks.filter(t => t.owner === currentUser);
            }

            list.innerHTML = '';

            if (tasksToShow.length === 0) {
                list.innerHTML = `
                    <li class="empty-state">
                        <div class="icon">✨</div>
                        <p>لا توجد مهام بعد</p>
                        <p>${user.isAdmin ? 'لم يضف الموظفون أي مهام' : 'أضف مهمتك الأولى!'}</p>
                    </li>
                `;
            } else {
                tasksToShow.forEach(task => {
                    const li = document.createElement('li');
                    li.className = `task-item ${task.completed ? 'completed' : ''}`;
                    
                    const showOwner = user.isAdmin && selectedUserFilter === 'all';
                    const ownerDisplay = showOwner 
                        ? `<div class="task-owner">${task.ownerName || USERS[task.owner]?.name || task.owner}</div>` 
                        : '';

                    const canDelete = task.owner === currentUser;
                    const canToggle = task.owner === currentUser || user.isAdmin;

                    const timeStr = task.createdAt?.toDate ? 
                        task.createdAt.toDate().toLocaleString('ar-SA') : 
                        (task.createdAtLocal ? new Date(task.createdAtLocal).toLocaleString('ar-SA') : '');

                    li.innerHTML = `
                        <div class="task-checkbox ${canToggle ? '' : 'disabled'}" 
                             onclick="${canToggle ? `toggleTask('${task.id}')` : ''}"
                             style="${canToggle ? '' : 'cursor: default; opacity: 0.5;'}"></div>
                        <div class="task-content">
                            <span class="task-text">${escapeHtml(task.text)}</span>
                            ${ownerDisplay}
                            <div class="task-time">${timeStr}</div>
                        </div>
                        ${canDelete ? `<button class="delete-btn" onclick="deleteTask('${task.id}')">×</button>` : ''}
                    `;
                    list.appendChild(li);
                });
            }

            updateStats(tasksToShow);
        }

        function updateStats(tasksToShow) {
            const total = tasksToShow.length;
            const completed = tasksToShow.filter(t => t.completed).length;
            const pending = total - completed;

            document.getElementById('total-stat').textContent = `المجموع: ${total}`;
            document.getElementById('completed-stat').textContent = `مكتمل: ${completed}`;
            document.getElementById('pending-stat').textContent = `متبقي: ${pending}`;

            document.getElementById('email-btn').disabled = total === 0;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function sendEmailReport() {
            const user = USERS[currentUser];
            let tasksToReport = [];

            if (user.isAdmin) {
                if (selectedUserFilter === 'all') {
                    tasksToReport = [...allTasks];
                } else {
                    tasksToReport = allTasks.filter(t => t.owner === selectedUserFilter);
                }
            } else {
                tasksToReport = allTasks.filter(t => t.owner === currentUser);
            }

            const total = tasksToReport.length;
            const completed = tasksToReport.filter(t => t.completed).length;
            const pending = total - completed;

            const today = new Date().toLocaleDateString('ar-SA', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            let report = `تقرير مهام الفريق - ${today}\n`;
            report += `═══════════════════════════\n\n`;
            report += `📊 الإحصائيات:\n`;
            report += `• المجموع: ${total} مهام\n`;
            report += `• المكتمل: ${completed} ✓\n`;
            report += `• المتبقي: ${pending}\n\n`;

            if (user.isAdmin && selectedUserFilter === 'all') {
                const byOwner = {};
                tasksToReport.forEach(t => {
                    if (!byOwner[t.owner]) byOwner[t.owner] = [];
                    byOwner[t.owner].push(t);
                });

                Object.keys(byOwner).forEach(owner => {
                    const ownerTasks = byOwner[owner];
                    const ownerName = USERS[owner]?.name || owner;
                    report += `\n👤 ${ownerName}:\n`;
                    ownerTasks.forEach(t => {
                        report += `  ${t.completed ? '✓' : '☐'} ${t.text}\n`;
                    });
                });
            } else {
                if (completed > 0) {
                    report += `✅ المهام المكتملة:\n`;
                    tasksToReport.filter(t => t.completed).forEach(t => {
                        report += `  ✓ ${t.text}\n`;
                    });
                    report += `\n`;
                }

                if (pending > 0) {
                    report += `⏳ المهام المتبقية:\n`;
                    tasksToReport.filter(t => !t.completed).forEach(t => {
                        report += `  ☐ ${t.text}\n`;
                    });
                }
            }

            report += `\n═══════════════════════════\n`;
            report += `تم إنشاء هذا التقرير بواسطة تطبيق قائمة مهام الفريق`;

            const subject = encodeURIComponent(`تقرير مهام الفريق - ${today}`);
            const body = encodeURIComponent(report);

            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        init();
    </script>
</body>
</html>
