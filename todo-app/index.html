<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة مهامي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .stat {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .app-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .input-section input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            transition: border-color 0.3s;
        }

        .input-section input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-section button {
            padding: 15px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-section button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .tasks-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .task-item:hover {
            background: #f0f0f0;
        }

        .task-item.completed {
            background: #e8f5e9;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: #888;
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #667eea;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .task-checkbox:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .task-item.completed .task-checkbox {
            background: #4caf50;
            border-color: #4caf50;
        }

        .task-checkbox::after {
            content: '✓';
            color: white;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .task-item.completed .task-checkbox::after {
            opacity: 1;
        }

        .task-text {
            flex: 1;
            font-size: 1rem;
            color: #333;
        }

        .delete-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: #ffebee;
            color: #e53935;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            background: #e53935;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .email-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .email-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .email-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
        }

        .email-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 1.6rem;
            }
            
            .app-card {
                padding: 20px;
            }
            
            .input-section {
                flex-direction: column;
            }
            
            .input-section button {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📋 قائمة مهامي</h1>
            <p>نظم يومك وأنجز أكثر</p>
            <div class="stats">
                <span class="stat" id="total-stat">المجموع: 0</span>
                <span class="stat" id="completed-stat">مكتمل: 0</span>
                <span class="stat" id="pending-stat">متبقي: 0</span>
            </div>
        </header>

        <div class="app-card">
            <div class="input-section">
                <input type="text" id="task-input" placeholder="أضف مهمة جديدة..." autofocus>
                <button onclick="addTask()" id="add-btn">+</button>
            </div>

            <ul class="tasks-list" id="tasks-list">
                <li class="empty-state" id="empty-state">
                    <div class="icon">✨</div>
                    <p>لا توجد مهام بعد</p>
                    <p>أضف مهمتك الأولى!</p>
                </li>
            </ul>

            <div class="email-section">
                <button class="email-btn" onclick="sendEmailReport()" id="email-btn" disabled>
                    <span>📧</span>
                    <span>إرسال تقرير بالإيميل</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        let tasks = [];

        function init() {
            const saved = localStorage.getItem('my-tasks');
            if (saved) {
                tasks = JSON.parse(saved);
            }
            renderTasks();
            
            document.getElementById('task-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTask();
                }
            });
        }

        function saveTasks() {
            localStorage.setItem('my-tasks', JSON.stringify(tasks));
            updateStats();
        }

        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;
            
            document.getElementById('total-stat').textContent = `المجموع: ${total}`;
            document.getElementById('completed-stat').textContent = `مكتمل: ${completed}`;
            document.getElementById('pending-stat').textContent = `متبقي: ${pending}`;
            
            document.getElementById('email-btn').disabled = total === 0;
        }

        function addTask() {
            const input = document.getElementById('task-input');
            const text = input.value.trim();
            
            if (!text) return;
            
            tasks.push({
                id: Date.now(),
                text: text,
                completed: false,
                createdAt: new Date().toISOString()
            });
            
            input.value = '';
            saveTasks();
            renderTasks();
            input.focus();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('tasks-list');
            const emptyState = document.getElementById('empty-state');
            
            list.innerHTML = '';
            
            if (tasks.length === 0) {
                list.innerHTML = `
                    <li class="empty-state">
                        <div class="icon">✨</div>
                        <p>لا توجد مهام بعد</p>
                        <p>أضف مهمتك الأولى!</p>
                    </li>
                `;
            } else {
                tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.className = `task-item ${task.completed ? 'completed' : ''}`;
                    li.innerHTML = `
                        <div class="task-checkbox" onclick="toggleTask(${task.id})"></div>
                        <span class="task-text">${escapeHtml(task.text)}</span>
                        <button class="delete-btn" onclick="deleteTask(${task.id})">×</button>
                    `;
                    list.appendChild(li);
                });
            }
            
            updateStats();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function sendEmailReport() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;
            
            const today = new Date().toLocaleDateString('ar-SA', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            
            let report = `تقرير مهامي - ${today}\n`;
            report += `═══════════════════════════\n\n`;
            report += `📊 الإحصائيات:\n`;
            report += `• المجموع: ${total} مهام\n`;
            report += `• المكتمل: ${completed} ✓\n`;
            report += `• المتبقي: ${pending}\n\n`;
            
            if (completed > 0) {
                report += `✅ المهام المكتملة:\n`;
                tasks.filter(t => t.completed).forEach(t => {
                    report += `  ✓ ${t.text}\n`;
                });
                report += `\n`;
            }
            
            if (pending > 0) {
                report += `⏳ المهام المتبقية:\n`;
                tasks.filter(t => !t.completed).forEach(t => {
                    report += `  ☐ ${t.text}\n`;
                });
            }
            
            report += `\n═══════════════════════════\n`;
            report += `تم إنشاء هذا التقرير بواسطة تطبيق قائمة مهامي`;
            
            const subject = encodeURIComponent(`تقرير مهامي - ${today}`);
            const body = encodeURIComponent(report);
            
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        init();
    </script>
</body>
</html>
