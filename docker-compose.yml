# منصة صوت الموظف - Docker Compose
# ===================================
# 
# للتشغيل:
#   docker-compose up -d
#
# لعرض السجلات:
#   docker-compose logs -f
#
# لإيقاف التشغيل:
#   docker-compose down

version: '3.8'

services:
  app:
    build: .
    container_name: employee-voice-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production-min-32-characters}
      - JWT_EXPIRES_IN=8h
      - DB_PATH=/app/data/complaints.db
      - UPLOAD_PATH=/app/uploads
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-Admin@2024!}
      - DEFAULT_ADMIN_NAME=${DEFAULT_ADMIN_NAME:-مدير النظام}
    volumes:
      # حفظ البيانات بشكل دائم
      - complaint_data:/app/data
      - complaint_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  complaint_data:
    name: employee-voice-data
  complaint_uploads:
    name: employee-voice-uploads
